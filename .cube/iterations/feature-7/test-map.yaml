    standard: standards/testing/integration.md
    test_file: src/server/services/discussion-integration.test.ts
    covers:
      - "Task-07：在发送消息后接入自动事件检测"
      - "Task-15：实现 Director 消费事件结果并产生调度提示"
      - "Task-16：在服务层注入 recentEvents 并标记 Director 消费状态"
  - type: web-e2e
    standard: standards/testing/web-e2e.md
    test_file: src/app/api/discussions/events-api.test.ts
    covers:
      - "Task-09：实现事件列表和事件/投票 API 路由"
      - "Task-06：实现事件创建并将事件写入消息流"
      - "Task-08：实现投票提交、幂等和票数更新"
  - type: frontend-ui
    standard: standards/testing/frontend-ui.md
    test_file: src/modules/discussion/event-card.test.tsx
    covers:
      - "Task-11：实现事件卡与投票网格组件"
      - "Task-12：将事件卡接入消息流并保持滚动体验"
      - "Task-13：实现讨论页面事件交互接线和手动触发"
